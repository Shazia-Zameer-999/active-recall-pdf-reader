<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall — PDF Study Reader</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/reader.css" />
    <link rel="stylesheet" href="css/active-recall.css" />

    <!-- <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script defer src="js/pdf-config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script> -->
  </head>
  <body data-theme="light">
    <div id="app">
      <!-- The router injects the current page's HTML here -->
    </div>

    <!-- 1. Config — must load first, defines CONFIG -->
    <script src="config.js"></script>

    <!-- 2. Core modules — no dependencies on pages -->
    <script defer src="js/storage.js"></script>
    <script defer src="js/db.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/commandPalette.js"></script>
    <script defer src="js/spacedRepetition.js"></script>
    <script defer src="js/gemini.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/ocr.js"></script>
    <script defer src="js/activeRecall.js"></script>
    <script defer src="js/annotations.js"></script>
    <script defer src="js/timer.js"></script>
    <script defer src="js/studySessions.js"></script>
    <script defer src="js/realtime.js"></script>
    <script defer src="js/notifications.js"></script>
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/flashcards.css" />
    <link rel="stylesheet" href="css/quiz.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/analytics.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/friends.css" />
    <link rel="stylesheet" href="css/groups.css" />
    <link rel="stylesheet" href="css/timer.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="stylesheet" href="css/annotations.css" />

    <!-- Create the shared Pages namespace ONCE, before any page files load.
       Each page file below just adds to this object — it does NOT redeclare it. -->
    <script>
      window.Pages = window.Pages || {};
    </script>

    <!-- 3. Page modules — order among these doesn't matter, they all attach to window.Pages -->
    <script defer src="js/pages/landing.js"></script>
    <script defer src="js/pages/dashboard.js"></script>
    <script defer src="js/pages/library.js"></script>
    <script defer src="js/pages/reader.js"></script>
    <script defer src="js/pages/notes.js"></script>
    <script defer src="js/pages/flashcards.js"></script>
    <script defer src="js/pages/quiz.js"></script>
    <script defer src="js/pages/analytics.js"></script>
    <script defer src="js/pages/settings.js"></script>
    <script defer src="js/pages/profile.js"></script>
    <script defer src="js/pages/friends.js"></script>
    <script defer src="js/pages/groups.js"></script>

    <!-- 4. Layout — needs Theme -->
    <script defer src="js/layout.js"></script>

    <!-- 5. Router — needs Pages + Layout -->
    <script defer src="js/router.js"></script>

    <!-- 6. App entry point — runs everything, must be last -->
    <script defer src="js/app.js"></script>
    <script defer type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>
  </body>
</html>
